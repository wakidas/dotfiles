onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
[session]
# サーバ再起動後もサイドバーの agent を復元し、元の会話セッションに resume する
resume_agents_on_restore = true

[experimental]
pane_history = false

[theme]
name = "nord"
auto_switch = false

[keys]
# wezterm の leader が ctrl+b なので衝突を避けて ctrl+q にする
prefix = "ctrl+q"
# 下方向の分割を prefix+s に（既定は prefix+minus）
split_horizontal = "prefix+s"
# prefix+s を明け渡すため settings を退避（既定は prefix+s）
settings = "prefix+shift+s"
# tab名変更（既定は prefix+shift+t）
rename_tab = "prefix+,"

# --- herdr-annotate（plannotator/herdr-annotate）---
# README の推奨キーに従う。ただし prefix+o は既定の open_notification_target と衝突するため、
# annotate.open は prefix+d（document）に移す
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"
